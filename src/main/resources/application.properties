spring.application.name=event-driven-notification-platform
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/notification_platform
spring.datasource.username=notification_user
spring.datasource.password=notification_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=notification
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
